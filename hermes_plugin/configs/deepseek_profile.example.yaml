# Reference snippet for the hermes profile config.yaml.
#
# There are two places you may need to merge this into:
#   - profile config:        ~/.hermes/profiles/quant/config.yaml
#   - profile env vars:      ~/.hermes/profiles/quant/.env
#
# If `hermes profile quant --clone` has already copied the DeepSeek-related config over from the current profile,
# you usually don't need to repeat it here; this is only useful when first configuring a profile or building one from scratch.

providers:
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}                    # read from the profile's .env
    base_url: https://api.deepseek.com/v1
    default_model: deepseek-chat
    models:
      - id: deepseek-chat
        display_name: DeepSeek Chat
        context_window: 65536
      - id: deepseek-reasoner
        display_name: DeepSeek Reasoner (R1)
        context_window: 65536

agent:
  default_model: deepseek/deepseek-chat             # provider/model format
  enabled_toolsets:
    - core                                          # hermes built-in: files / terminal / search, etc.
    - quant                                         # provided by this plugin

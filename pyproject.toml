[project]
name = "quant"
version = "0.1.0"
description = "A-share small-cap quant research and trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jqdatasdk>=1.9.8",
  "jqfactor-analyzer>=1.1.0",
  "matplotlib>=3.10.8",
  "numpy>=2.4.3",
  "pandas>=3.0.1",
  "pysocks>=1.7.1",
  # JqClient etc. use it to load the repo-root .env automatically (JQ_USERNAME / JQ_PASSWORD / proxy); if it is missing, .env is silently ignored.
  "python-dotenv>=1.2.2",
  "redis>=7.4.0",
  "requests>=2.32.0",
  "scipy>=1.17.1",
  "vectorbt>=0.28.1",
  "yfinance>=0.2.66",
]

[project.optional-dependencies]
# The GBM factor-aggregation strategy (gbm-train / gbm_multifactor) needs lightgbm.
# When it is not installed the strategy degrades to a neutral score and the main flow is unaffected. Install with `uv sync --extra ml`
ml = [
  "lightgbm>=4.5.0",
]
# LLM layer (--mode nlp-analyze, direct DeepSeek): only uses requests, which is already a main dependency, so nothing extra is declared.
# Hermes agent layer (--mode hermes-chat): hermes-agent is installed into ~/.hermes/ (its own Py 3.11 venv),
# bridged via subprocess. So it is **not a pip dependency of this project**; install it with `bash quant/ml/hermes/setup.sh`.

# Do not put anything into a group named `dev`: uv installs `dev` by default, so CI (uv sync --frozen) and ordinary users would be dragged into it.
# Install the Jupyter kernel on demand: `make jupyter` (or `uv sync --group jupyter`).
[dependency-groups]
jupyter = [
  "ipykernel>=7.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.uv]
package = true

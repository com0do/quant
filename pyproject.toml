[project]
name = "quant"
version = "0.1.0"
description = "A-share small-cap quant research and trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jqdatasdk>=1.9.8",
  "jqfactor-analyzer>=1.1.0",
  "matplotlib>=3.10.8",
  "numpy>=2.4.3",
  "pandas>=3.0.1",
  "pysocks>=1.7.1",
  "redis>=7.4.0",
  "requests>=2.32.0",
  "scipy>=1.17.1",
  "vectorbt>=0.28.1",
  "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
  "ipykernel>=7.2.0",
  "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.uv]
default-groups = ["dev"]
package = true

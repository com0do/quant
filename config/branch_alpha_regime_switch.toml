[data]
source = "sqlite"
sqlite_db_path = "data/market_cache.db"
start_date = "2025-01-01"
end_date = "2025-12-23"
benchmark_index = "000852.XSHG"

[strategy]
strategy_names = ["csi1000_enhanced"]
strategy_weights = [1.0]
buy_score_threshold = 0.00
sell_score_threshold = 0.94
entry_interval_days = 2
top_k = 4
max_positions = 4
stop_loss_pct = 0.05
trailing_stop_pct = 0.10
min_hold_days = 2
weekly_auto_weight = false
dual_layer_enable = false
value_filter_strict = false
require_above_ma200 = false
allow_short_below_ma200_exception = true
ma200_exception_min_ret5 = 0.03
ma200_exception_vol_ratio_min = 1.2
ma200_exception_vol_ratio_max = 3.2
open_vol_min = 0.008
open_vol_max = 0.045
max_single_trade_risk_pct = 0.015
max_single_position_loss_pct = 0.05
max_total_exposure_pct = 1.00
market_regime_gate_enable = false
market_regime_min_win_prob = 0.55
market_regime_min_breadth = 0.50

# Regime parameter switch (no strong gate, parameter adaptation only).
regime_param_switch_enable = true
regime_switch_breadth_risk_on = 0.60
regime_switch_breadth_risk_off = 0.44
regime_switch_top_k_delta_on = 0
regime_switch_top_k_delta_off = -1
regime_switch_sell_thr_delta_on = -0.02
regime_switch_sell_thr_delta_off = 0.02
regime_switch_entry_interval_mult_on = 0.5
regime_switch_entry_interval_mult_off = 2.0
regime_switch_exposure_mult_on = 1.0
regime_switch_exposure_mult_off = 0.74

signal_weighted_allocation_enable = false
signal_weighted_power = 1.2
signal_weighted_max_ratio = 0.40

monthly_dynamic_exposure_enable = true
monthly_exposure_min_pct = 0.80
monthly_exposure_max_pct = 1.00
crash_ret5_threshold = -0.08
crash_ret20_threshold = -0.14
crash_breadth_threshold = 0.25
crash_cooldown_days = 1

pause_after_consecutive_loss_days = 2
pause_after_loss_pause_days = 1
trend_extend_hold = true

[daemon]
preopen_scan_threads = 16

[execution]
buy_fee = 0.0003
sell_fee = 0.0013
slippage_bps = 5.0

[project]
name = "quant"
version = "0.1.0"
description = "A-share small-cap quant research and trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jqdatasdk>=1.9.8",
  "jqfactor-analyzer>=1.1.0",
  "matplotlib>=3.10.8",
  "numpy>=2.4.3",
  "pandas>=3.0.1",
  "pysocks>=1.7.1",
  "redis>=7.4.0",
  "requests>=2.32.0",
  "scipy>=1.17.1",
  "vectorbt>=0.28.1",
  "yfinance>=0.2.66",
]

[project.optional-dependencies]
# GBM 因子聚合策略（gbm-train / gbm_multifactor 策略）需要 lightgbm。
# 未安装时：策略会降级为中性分，主链路不受影响。安装：`uv sync --extra ml`
ml = [
  "lightgbm>=4.5.0",
]
# LLM 层（--mode nlp-analyze，直连 DeepSeek）：只用 requests，已在主依赖里，无需额外声明。
# Hermes agent 层（--mode hermes-chat）：hermes-agent 装到 ~/.hermes/（独立 Py 3.11 venv），
# 通过 subprocess 桥。所以**不作为本工程的 pip 依赖**——用 `bash quant/ml/hermes/setup.sh` 安装。

[dependency-groups]
dev = [
  "ipykernel>=7.2.0",
  "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.uv]
default-groups = ["dev"]
package = true

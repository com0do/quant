[data]
source = "sqlite"
sqlite_db_path = "data/runtime/market_csi300_500_latest.db"
runtime_csi300_500_db_path = "data/runtime/market_csi300_500_latest.db"
runtime_csi1000_db_path = "data/runtime/market_csi1000_latest.db"
runtime_csi2000_db_path = "data/runtime/market_csi2000_latest.db"
meta_constituents_db_path = "data/meta/index_constituents.db"
enable_index_aware_db = true
cross_index_hold_enable = true
cross_index_candidates = ["000905.XSHG"]
benchmark_index = "000852.XSHG"
realtime_quote_source = "qmt_http"

[gateway]
base_url = "http://127.0.0.1:18080"
token = ""
timeout_sec = 8
account_id = ""

[strategy]
strategy_names = ["csi1000_enhanced"]
strategy_weights = [1.0]
buy_score_threshold = 0.55
sell_score_threshold = 0.62
top_k = 10
max_positions = 10

[daemon]
broker_type = "qmt_http"
dry_run = true
poll_interval_sec = 5
preopen_scan_threads = 8
execution_plan_path = "data/runtime/live_execution_plan.json"
preopen_use_execution_plan_watchlist = true
anti_chase_enable = true
max_buy_deviation_bps = 20.0
max_sell_deviation_bps = 30.0
max_total_chase_bps = 24.0
anti_fomo_enable = true
anti_fomo_intraday_ret_threshold = 0.06
anti_fomo_upper_shadow_threshold = 0.45
anti_fomo_near_high_threshold = 0.985

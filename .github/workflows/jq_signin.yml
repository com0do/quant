name: JQ Daily Sign-in

on:
  schedule:
    # 每天 08:00 CST (00:00 UTC) — 签到领积分
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install playwright scipy Pillow numpy
          uv run playwright install chromium --with-deps

      - name: Run JQ auto claim
        env:
          JQ_USERNAME: ${{ secrets.JQ_USERNAME }}
          JQ_PASSWORD: ${{ secrets.JQ_PASSWORD }}
        run: |
          uv run python scripts/jq_auto_claim.py 2>&1 | tee jq_claim_output.txt

      - name: Report
        if: always()
        run: |
          echo "### JQ Daily Sign-in" >> $GITHUB_STEP_SUMMARY
          if [ -f jq_claim_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 jq_claim_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

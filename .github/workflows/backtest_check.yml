name: Daily Backtest Check

# Backtest drift check: data comes from the home node (optional R2 cold backup). Runs on push to main or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      config:
        description: 'Config file to backtest'
        required: false
        default: 'config/final_freeze_2025.toml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --frozen
          sudo apt-get install -y -qq rclone xz-utils sqlite3

      - name: Pull data snapshot from R2
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_HOSTNAME_PREFIX:   ${{ secrets.R2_HOSTNAME_PREFIX }}
        run: bash scripts/ci_pull_r2_data.sh

      - name: Run backtest
        id: backtest
        run: |
          CONFIG="${{ inputs.config || 'config/final_freeze_2025.toml' }}"
          echo "Running backtest with config: $CONFIG"
          if [ ! -f data/runtime/market_csi1000_latest.db ]; then
            echo "::warning::No data present (R2 secrets not configured); skipping backtest"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run python main.py --mode backtest --config "$CONFIG" 2>&1 | tee backtest_output.txt

      - name: Parse metrics
        id: metrics
        if: success() && steps.backtest.outputs.skipped != 'true'
        run: |
          METRICS_FILE="output/backtest_metrics.json"
          if [ -f "$METRICS_FILE" ]; then
            {
              printf 'ann_return=%.4f\n'        "$(jq -r '.ann_return'        "$METRICS_FILE")"
              printf 'excess_ann_return=%.4f\n' "$(jq -r '.excess_ann_return' "$METRICS_FILE")"
              printf 'sharpe=%.4f\n'            "$(jq -r '.sharpe'            "$METRICS_FILE")"
              printf 'max_drawdown=%.4f\n'      "$(jq -r '.max_drawdown'      "$METRICS_FILE")"
              printf 'trade_count=%s\n'         "$(jq -r '.trade_count'       "$METRICS_FILE")"
              printf 'final_equity=%.2f\n'      "$(jq -r '.final_equity'      "$METRICS_FILE")"
            } >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: No backtest metrics found (data may be missing)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for drift
        if: steps.metrics.outputs.skipped != 'true'
        run: |
          echo "### Backtest Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Annual Return | ${{ steps.metrics.outputs.ann_return }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Excess Return | ${{ steps.metrics.outputs.excess_ann_return }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sharpe | ${{ steps.metrics.outputs.sharpe }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Drawdown | ${{ steps.metrics.outputs.max_drawdown }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trade Count | ${{ steps.metrics.outputs.trade_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Final Equity | ${{ steps.metrics.outputs.final_equity }} |" >> $GITHUB_STEP_SUMMARY

          # Drift check: alert if Sharpe drops below 1.0 or max drawdown exceeds 20%
          SHARPE=$(echo "${{ steps.metrics.outputs.sharpe }}" | awk '{print ($1+0)}')
          DRAWDOWN=$(echo "${{ steps.metrics.outputs.max_drawdown }}" | awk '{print ($1+0)}')

          if [ "$(echo "$SHARPE < 1.0" | bc -l)" -eq 1 ]; then
            echo "⚠️ WARNING: Sharpe ratio ($SHARPE) below 1.0 threshold!" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$(echo "$DRAWDOWN < -0.20" | bc -l)" -eq 1 ]; then
            echo "⚠️ WARNING: Max drawdown ($DRAWDOWN) exceeds -20% threshold!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            output/backtest_metrics.json
            output/backtest_trades.csv
            output/backtest_equity_curve.csv
          retention-days: 30
